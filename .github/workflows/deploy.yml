name: Deploy site.zip to Pages

on:
  push:
    branches: [ main ]
    paths: [ 'site.zip' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: unzip site.zip
        run: |
          mkdir -p _site
          unzip -o site.zip -d _site
          inner=$(ls -d _site/*/ 2>/dev/null | head -n1 || true)
          if [ -n "$inner" ] && [ ! -f _site/index.html ]; then
            if [ -f "${inner}index.html" ]; then
              mv "$inner"* _site/ 2>/dev/null || true
            fi
          fi
          ls -la _site

      - name: upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
